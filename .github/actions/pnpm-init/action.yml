---
name: 'PNPM Init Action'
description: 'Initialize PNPM'
runs:
  using: 'composite'
  steps:
    - name: 🆙 Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        run_install: false

    - name: 🆙 Setup pnpm config
      shell: bash
      run: pnpm config set store-dir .pnpm-store

    - name: ⏬ Install pnpm
      shell: bash
      run: pnpm install
